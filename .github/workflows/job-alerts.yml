name: Job Alert Scanner

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. Runs every 30 minutes.
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: job-alert-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan job sources and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_APP_PASSWORD: ${{ secrets.IMAP_APP_PASSWORD }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
        run: python main.py

      - name: Persist deduplication state and CSV log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json job_log.csv
          git diff --cached --quiet || git commit -m "Update job alert log"
          git push
